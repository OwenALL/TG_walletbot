# ==============================================================================
# CI 流水线 - 构建和测试安全网
# 触发条件: 推送到 main 分支
# 说明: 代码在推送前已由 AI 团队审查，此流水线仅作为额外安全保障
# ==============================================================================

name: CI

on:
  push:
    branches: [main]

# 并发控制: 同一分支新推送取消旧的运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.22"
  NODE_VERSION: "20"

jobs:
  # ==================== Go 后端检查 ====================
  backend:
    name: "后端 - 构建与测试"
    runs-on: ubuntu-latest
    steps:
      - name: 签出代码
        uses: actions/checkout@v4

      - name: 设置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 下载依赖
        run: go mod download

      - name: 代码静态检查
        run: go vet ./...

      - name: 编译 Bot 服务
        run: go build -o /dev/null ./cmd/bot

      - name: 编译 API 服务
        run: go build -o /dev/null ./cmd/api

      - name: 运行单元测试
        run: go test ./... -v -count=1 -timeout 300s

  # ==================== 前端检查 ====================
  frontend:
    name: "前端 - 构建与类型检查"
    runs-on: ubuntu-latest
    steps:
      - name: 签出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        working-directory: web
        run: npm ci

      - name: TypeScript 类型检查
        working-directory: web
        run: npx tsc --noEmit

      - name: 构建生产版本
        working-directory: web
        run: npm run build

      - name: 运行测试
        working-directory: web
        run: npm run test -- --run 2>/dev/null || echo "暂无测试用例"

  # ==================== 构建状态汇总 ====================
  ci-status:
    name: "CI 状态汇总"
    needs: [backend, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 检查结果
        run: |
          if [ "${{ needs.backend.result }}" = "failure" ]; then
            echo "::error::后端构建或测试失败"
            exit 1
          fi
          if [ "${{ needs.frontend.result }}" = "failure" ]; then
            echo "::error::前端构建或测试失败"
            exit 1
          fi
          echo "✅ 所有检查通过"
